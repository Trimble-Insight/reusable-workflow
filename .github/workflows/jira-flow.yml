# Reusable Jira workflow: lives in a PUBLIC repo and holds no secrets.
# jira-user-email / jira-api-token must be passed down by every level of the calling chain
# (top-level -> middle -> this), either explicitly or with `secrets: inherit`.
#
#   flow: change-request  -> PR into release/production. One ticket per version, one link per PR.
#   flow: consolidation   -> PR MERGED (or push) into release/staging. One ticket per previous production
#                            version, one link per REPO (no PRs), change summary per merge, linked work
#                            items, and a "Staging consolidation x.y.z" page in the release folder.
name: Jira flow (reusable)

on:
  workflow_call:
    inputs:
      flow:
        description: "change-request | consolidation"
        type: string
        required: true
      version:
        description: >
          Full version string (e.g. from env.VERSION). Overrides the production-version secret.
          Trimmed to MAJOR.MINOR.HOTFIX.
        type: string
        default: ""
      jira-project-key:
        type: string
        required: true
      jira-base-url:
        description: Preferred over the jira-base-url secret - a secret URL gets masked (***) in logs and summaries
        type: string
        default: ""
      issue-type:
        type: string
        default: Task
      issue-key:
        description: Attach to this existing ticket instead of auto-creating one per version
        type: string
        default: ""
      summary-template:
        description: 'Defaults: "Production release {version}" / "Staging consolidation {version}"'
        type: string
        default: ""
      extra-fields:
        description: JSON merged into the create payload (required custom fields)
        type: string
        default: "{}"
      require-approval:
        description: change-request only - fail unless the ticket is in an approved status
        type: boolean
        default: false
      link-consolidation:
        description: >
          Link the production change request and the staging consolidation ticket for the same version
          (works from either flow, whichever runs second). The consolidation ticket is kept out of the
          work-item lists in Confluence and shown as "Staging consolidation" in the release record.
        type: boolean
        default: true
      consolidation-link-type:
        description: Jira issue link type used between the two tickets
        type: string
        default: Relates
      approval-roles:
        description: >
          change-request only - roles for the Approvals table added to the ticket description (comma-separated).
          Added once; approvers fill it in and the pipeline never changes it. Empty = no table.
        type: string
        default: "Product Manager, Engineering Manager, Team Lead, Deployment Lead, Product Owner, Head of Product"
      approved-statuses:
        description: Comma-separated status names that count as approved (case-insensitive)
        type: string
        default: Approved
      closed-statuses:
        description: >
          Leave empty (default) for exactly one ticket per version, whatever its status. Only if set, tickets in
          these statuses count as finished and a NEW ticket would be created for the same version.
        type: string
        default: ""
      delete-duplicates:
        description: >
          If two repos create a ticket at the same instant, move everything onto the oldest and delete the newer
          one (needs "Delete work items" permission; otherwise it is relabelled change-request-duplicate).
        type: boolean
        default: true
      include-summary:
        description: Add a change summary (stats, description, commits/feature PRs, Jira keys) to the Jira comment (change request - on open and merge; consolidation - on each merge to staging)
        type: boolean
        default: true
      summary-max-items:
        description: Max commits/feature PRs listed in the summary
        type: number
        default: 30
      link-issues:
        description: Add Jira keys found in the PR title, description and commits as linked work items (both flows)
        type: boolean
        default: true
      link-type:
        description: Jira issue link type name used for those links
        type: string
        default: Relates
      link-projects:
        description: Only link keys from these Jira projects, comma-separated (e.g. "ABC,DEF"). Empty = any project.
        type: string
        default: ""
      confluence-space-key:
        description: >
          Confluence space key for the release pages (change request - release record, test plan, release notes;
          consolidation - staging page). Rebuilt on every run and linked from the Jira ticket. Defaults to IDP
          (IHQ Deployment Plan); pass "" to turn pages off.
        type: string
        default: IDP
      confluence-folder-title-template:
        description: >
          Put each release's pages (release record, post-deployment plan, release notes) in one folder with this
          title; placeholders {version}, {key}, {summary}. Empty = no folder.
        type: string
        default: "Release {version}"
      confluence-parent-id:
        description: Optional page or folder ID to create the release folder (or pages) under
        type: string
        default: ""
      confluence-title-template:
        description: 'Page title; placeholders {key}, {summary}, {version}'
        type: string
        default: "Change request {key}: {summary}"
      confluence-manual-items:
        description: >
          Add a "Manual release items" table (#, Item, Owner, When, Status, Notes) to the release record, right
          below Overview. People edit it directly on the page; the pipeline never changes what they write.
        type: boolean
        default: true
      confluence-test-plan:
        description: >
          Create a "Post-deployment plan" page (child of the release record) for the test team: what to test is
          regenerated; the Smoke tests and Sign-off sections are theirs and are never changed by the pipeline.
        type: boolean
        default: true
      confluence-test-plan-title-template:
        description: 'Title of the post-deployment plan page; placeholders {key}, {summary}, {version}'
        type: string
        default: "Post-deployment plan {key}: {summary}"
      confluence-release-notes:
        description: >
          Publish product-manager-friendly release notes ("InsightHQ V5.2.1 - Release Notes"): release date, status,
          Overview and Known issues (written by PMs on the page, never overwritten), New features / Improvements /
          Bug fixes from the linked tickets, components and change management (incl. pending approvals).
        type: boolean
        default: true
      confluence-release-notes-title-template:
        description: 'Title of the release notes page; placeholders {product}, {version}, {key}, {summary}'
        type: string
        default: "{product} V{version} – Release Notes"
      release-notes-product:
        description: Product name for the release notes title (default - the Jira project name)
        type: string
        default: ""
      release-note-field:
        description: >
          Jira field holding a ticket's customer-facing sentence. If missing/empty, a line starting
          "Release note:" in the ticket description is used; otherwise just the ticket title.
        type: string
        default: "Release note"
      release-notes-skip-label:
        description: Tickets with this label are left out of the release notes (e.g. internal work)
        type: string
        default: no-release-notes
      confluence-release-notes-parent-id:
        description: Optional page ID to put release notes under (default - under the release record)
        type: string
        default: ""
      confluence-staging-page:
        description: >
          consolidation only - publish a "Staging consolidation" page in the release folder: repos merged, changes
          per merge, linked work items, and a "Staging tests" table for QA that the pipeline never changes.
        type: boolean
        default: true
      confluence-staging-title-template:
        description: 'Title of the staging page; placeholders {version}, {key}, {summary}'
        type: string
        default: "Staging consolidation {version}"
      comment-on-pr:
        description: change-request only - comment the Jira link on the PR (caller needs pull-requests write)
        type: boolean
        default: true
    secrets:
      jira-user-email:
        required: true
      jira-api-token:
        required: true
      jira-base-url:
        required: false
      production-version:
        description: Version as one secret, e.g. 1.4.2 (any build part is dropped)
        required: false
    outputs:
      issue-key:
        value: ${{ jobs.jira.outputs.issue-key }}
      version:
        value: ${{ jobs.jira.outputs.version }}
      confluence-url:
        value: ${{ jobs.jira.outputs.confluence-url }}

# No permissions block: the job gets exactly what the caller grants its GITHUB_TOKEN.
jobs:
  jira:
    name: Jira ${{ inputs.flow }}
    # Consolidation: on pull_request events only merged PRs count; push/dispatch/etc. always run.
    if: >-
      inputs.flow != 'consolidation' || github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue-key: ${{ steps.cr.outputs.issue-key }}
      version: ${{ steps.version.outputs.version }}
      confluence-url: ${{ steps.cr.outputs.confluence-url }}
    steps:
      - name: Check Jira credentials
        env:
          HAS_EMAIL: ${{ secrets.jira-user-email != '' }}
          HAS_TOKEN: ${{ secrets.jira-api-token != '' }}
        run: |
          if [ "$HAS_EMAIL" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::jira-user-email / jira-api-token arrived empty. Every workflow in the chain" \
                 "(top-level -> middle -> jira-flow) must pass them on: 'secrets: inherit' or explicit mapping."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRODUCTION_VERSION: ${{ secrets.production-version }}
        run: |
          # Priority: 'version' input, then 'production-version' secret.
          v="${INPUT_VERSION:-$PRODUCTION_VERSION}"
          if [ -z "$v" ]; then
            echo "::error::No version: pass the 'production-version' secret or the 'version' input"; exit 1
          fi
          # Tickets group on MAJOR.MINOR.HOTFIX only (v1.4.2.57 -> 1.4.2)
          trimmed=$(echo "$v" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$trimmed" ]; then
            echo "::error::Version is not MAJOR.MINOR.HOTFIX (got '$v'; empty parts usually mean a secret wasn't passed down)"
            exit 1
          fi
          echo "version=${trimmed#v}" >> "$GITHUB_OUTPUT"

      - name: Collect changes
        if: >-
          (inputs.include-summary || inputs.link-issues || inputs.confluence-space-key != '') &&
          ((github.event_name == 'pull_request' &&
            (github.event.action != 'closed' || github.event.pull_request.merged == true)) ||
           (github.event_name == 'push' && inputs.flow == 'consolidation'))
        continue-on-error: true   # a missing summary must never block the flow
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          OUT: ${{ runner.temp }}/pr-commits.jsonl
        run: |
          fields='{sha: .sha, msg: .commit.message, author: (.author.login // null)} | @json'
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100" --paginate --jq ".[] | $fields" > "$OUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq ".commits[] | $fields" > "$OUT"
          else
            : > "$OUT"
          fi
          echo "Collected $(wc -l < "$OUT") commit(s)"

      - name: Upsert Jira ticket
        id: cr
        # All values go through env (never inlined into the script) to prevent injection.
        env:
          CR_FLOW: ${{ inputs.flow }}
          CR_VERSION: ${{ steps.version.outputs.version }}
          JIRA_BASE_URL: ${{ inputs.jira-base-url || secrets.jira-base-url }}
          JIRA_USER_EMAIL: ${{ secrets.jira-user-email }}
          JIRA_API_TOKEN: ${{ secrets.jira-api-token }}
          JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
          JIRA_ISSUE_TYPE: ${{ inputs.issue-type }}
          JIRA_ISSUE_KEY: ${{ inputs.issue-key }}
          JIRA_SUMMARY_TEMPLATE: ${{ inputs.summary-template }}
          JIRA_EXTRA_FIELDS: ${{ inputs.extra-fields }}
          REQUIRE_APPROVAL: ${{ inputs.require-approval }}
          APPROVED_STATUSES: ${{ inputs.approved-statuses }}
          APPROVAL_ROLES: ${{ inputs.approval-roles }}
          LINK_CONSOLIDATION: ${{ inputs.link-consolidation }}
          CONSOLIDATION_LINK_TYPE: ${{ inputs.consolidation-link-type }}
          CLOSED_STATUSES: ${{ inputs.closed-statuses }}
          DELETE_DUPLICATES: ${{ inputs.delete-duplicates }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CR_INCLUDE_SUMMARY: ${{ inputs.include-summary }}
          CR_SUMMARY_MAX_ITEMS: ${{ inputs.summary-max-items }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_COMMITS_FILE: ${{ runner.temp }}/pr-commits.jsonl
          CR_LINK_ISSUES: ${{ inputs.link-issues }}
          CR_LINK_TYPE: ${{ inputs.link-type }}
          CR_LINK_PROJECTS: ${{ inputs.link-projects }}
          CONFLUENCE_SPACE_KEY: ${{ inputs.confluence-space-key }}
          CONFLUENCE_PARENT_ID: ${{ inputs.confluence-parent-id }}
          CONFLUENCE_FOLDER_TITLE_TEMPLATE: ${{ inputs.confluence-folder-title-template }}
          CONFLUENCE_TITLE_TEMPLATE: ${{ inputs.confluence-title-template }}
          CONFLUENCE_MANUAL_ITEMS: ${{ inputs.confluence-manual-items }}
          CONFLUENCE_TEST_PLAN: ${{ inputs.confluence-test-plan }}
          CONFLUENCE_TEST_PLAN_TITLE_TEMPLATE: ${{ inputs.confluence-test-plan-title-template }}
          CONFLUENCE_RELEASE_NOTES: ${{ inputs.confluence-release-notes }}
          CONFLUENCE_RELEASE_NOTES_TITLE_TEMPLATE: ${{ inputs.confluence-release-notes-title-template }}
          CONFLUENCE_RELEASE_NOTES_PARENT_ID: ${{ inputs.confluence-release-notes-parent-id }}
          RELEASE_NOTES_PRODUCT: ${{ inputs.release-notes-product }}
          RELEASE_NOTE_FIELD: ${{ inputs.release-note-field }}
          RELEASE_NOTES_SKIP_LABEL: ${{ inputs.release-notes-skip-label }}
          CONFLUENCE_STAGING_PAGE: ${{ inputs.confluence-staging-page }}
          CONFLUENCE_STAGING_TITLE_TEMPLATE: ${{ inputs.confluence-staging-title-template }}
        run: |
          python3 - <<'PY'
          import base64, json, os, random, re, sys, time, urllib.error, urllib.request

          def fail(m): print(f"::error::{m}"); sys.exit(1)
          def warn(m): print(f"::warning::{m}")
          def env(n, d="", req=False):
              v = (os.environ.get(n) or "").strip() or d
              if req and not v: fail(f"Missing required input for {n}")
              return v
          def flag(n): return env(n, "false").lower() in ("1", "true", "yes", "on")
          def slug(s): return re.sub(r"[^A-Za-z0-9._-]+", "-", s).strip("-")

          FLOW = env("CR_FLOW", "change-request")
          if FLOW not in ("change-request", "consolidation"):
              fail(f"flow must be 'change-request' or 'consolidation', got '{FLOW}'")
          CONSOLIDATION = FLOW == "consolidation"

          BASE = env("JIRA_BASE_URL", req=True).rstrip("/")
          AUTH = base64.b64encode(f"{env('JIRA_USER_EMAIL', req=True)}:{env('JIRA_API_TOKEN', req=True)}".encode()).decode()
          PROJECT = env("JIRA_PROJECT_KEY", req=True)
          VERSION = env("CR_VERSION", req=True)
          REPO = env("GITHUB_REPOSITORY", req=True)
          SERVER = env("GITHUB_SERVER_URL", "https://github.com")
          RUN_URL = f"{SERVER}/{REPO}/actions/runs/{env('GITHUB_RUN_ID', '0')}"
          PR_NUMBER = env("PR_NUMBER", req=not CONSOLIDATION)
          PR_URL = env("PR_URL", f"{SERVER}/{REPO}/pull/{PR_NUMBER}")
          PR_TITLE = env("PR_TITLE", f"PR #{PR_NUMBER}")
          PR_ACTION, PR_MERGED = env("PR_ACTION", "opened"), flag("PR_MERGED")
          PR_BASE = env("PR_BASE_REF", "release/staging" if CONSOLIDATION else "release/production")
          SHA = (env("PR_MERGE_SHA") if PR_MERGED else env("PR_HEAD_SHA")) or env("GITHUB_SHA")
          SHORT = SHA[:7]
          KIND_LABEL = "consolidation" if CONSOLIDATION else "change-request"
          VERSION_LABEL = env("CR_LABEL_PREFIX", "consolidation-" if CONSOLIDATION else "cr-") + slug(VERSION)
          SUMMARY = env("JIRA_SUMMARY_TEMPLATE",
                        "Staging consolidation {version}" if CONSOLIDATION else "Production release {version}")
          REPO_LABEL = "repo-" + slug(REPO.split("/")[-1])
          APPROVED = {s.strip().lower() for s in env("APPROVED_STATUSES", "Approved").split(",") if s.strip()}
          CLOSED_STATUSES = [s.strip() for s in env("CLOSED_STATUSES").split(",") if s.strip()]
          try:
              EXTRA = json.loads(env("JIRA_EXTRA_FIELDS", "{}"))
          except json.JSONDecodeError as e:
              fail(f"extra-fields is not valid JSON: {e}")

          class JiraError(Exception):
              def __init__(self, code, msg): super().__init__(msg); self.code = code

          def jira(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              for attempt in range(5):
                  req = urllib.request.Request(BASE + path, data=data, method=method, headers={
                      "Authorization": f"Basic {AUTH}", "Accept": "application/json",
                      "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          raw = r.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      text = e.read().decode(errors="replace")
                      if e.code in (429, 500, 502, 503, 504) and attempt < 4:
                          ra = e.headers.get("Retry-After")
                          time.sleep(float(ra) if ra else 2 ** attempt + random.random()); continue
                      raise JiraError(e.code, f"{method} {path} -> HTTP {e.code}: {text[:500]}") from None

          def adf(*paras):
              out = []
              for para in paras:
                  nodes = []
                  for part in para:
                      if isinstance(part, tuple):
                          nodes.append({"type": "text", "text": part[0],
                                        "marks": [{"type": "link", "attrs": {"href": part[1]}}]})
                      elif part:
                          nodes.append({"type": "text", "text": part})
                  out.append({"type": "paragraph", "content": nodes})
              return {"type": "doc", "version": 1, "content": out}

          APPROVAL_ROLES = [r.strip() for r in env("APPROVAL_ROLES").split(",") if r.strip()]

          def _cell(t, header=False):
              para = {"type": "paragraph", "content": ([{"type": "text", "text": t, **({"marks": [{"type": "strong"}]} if header else {})}]
                                                       if t else [])}
              return {"type": "tableHeader" if header else "tableCell", "attrs": {}, "content": [para]}

          def approvals_block():
              """ADF: 'Approvals' heading, a hint, and a table with one row per role."""
              head = ["Role", "Approver", "Decision", "Date", "Notes"]
              rows = [{"type": "tableRow", "content": [_cell(h, True) for h in head]}]
              for role in APPROVAL_ROLES:
                  rows.append({"type": "tableRow", "content": [_cell(role, True), _cell(""), _cell("Pending"), _cell(""), _cell("")]})
              return [{"type": "heading", "attrs": {"level": 2}, "content": [{"type": "text", "text": "Approvals"}]},
                      {"type": "paragraph", "content": [{"type": "text", "marks": [{"type": "strong"}], "text":
                          "⚠ This change request must not be closed until every role below has approved."}]},
                      {"type": "paragraph", "content": [{"type": "text", "text":
                          "Approvers: edit this table with your name, decision (Approved / Rejected) and date. "
                          "The pipeline adds it once and never changes it."}]},
                      {"type": "table", "attrs": {"isNumberColumnEnabled": False, "layout": "default"}, "content": rows}]

          def _is_approvals_heading(n):
              return n.get("type") == "heading" and "".join(c.get("text", "") for c in n.get("content", [])).strip().lower() == "approvals"

          def ensure_approvals(key):
              """Add the Approvals table to an existing ticket's description once (never edits it afterwards)."""
              if not APPROVAL_ROLES: return
              desc = jira("GET", f"/rest/api/3/issue/{key}?fields=description")["fields"].get("description") \
                  or {"type": "doc", "version": 1, "content": []}
              if any(_is_approvals_heading(n) for n in desc.get("content", [])):
                  return dedupe_approvals(key, desc)
              desc["content"] = desc.get("content", []) + approvals_block()
              jira("PUT", f"/rest/api/3/issue/{key}", {"fields": {"description": desc}})
              print(f"Added approvals table to {key}")
              time.sleep(random.uniform(1, 2))   # two repos at once? re-read and keep only the first table
              dedupe_approvals(key, jira("GET", f"/rest/api/3/issue/{key}?fields=description")["fields"].get("description") or {})

          def dedupe_approvals(key, desc):
              content = desc.get("content", [])
              idx = [i for i, n in enumerate(content) if _is_approvals_heading(n)]
              if len(idx) < 2: return
              drop = set()
              for i in idx[1:]:   # remove later copies: heading + hint + table
                  j = i + 1
                  while j < len(content) and content[j].get("type") not in ("table", "heading"): j += 1
                  drop.update(range(i, (j + 1) if j < len(content) and content[j].get("type") == "table" else (i + 1)))
              desc["content"] = [n for k, n in enumerate(content) if k not in drop]
              jira("PUT", f"/rest/api/3/issue/{key}", {"fields": {"description": desc}})
              print(f"Removed {len(idx) - 1} duplicate approvals table(s) from {key}")

          PARTNER_LINK_TYPE = env("CONSOLIDATION_LINK_TYPE", "Relates")
          STAGING = {"key": None}   # consolidation ticket for this version (change-request flow), set in main()
          CR_PARTNER = {"key": None}   # production change request for this version (consolidation flow), set in main()

          def find_partner():
              """The other flow's ticket for the same version: consolidation <-> change request."""
              label = ("cr-" if CONSOLIDATION else "consolidation-") + slug(VERSION)
              found = jira("POST", "/rest/api/3/search/jql", {
                  "jql": f'project = "{PROJECT}" AND labels = "{label}"', "fields": ["summary"], "maxResults": 10}).get("issues", [])
              return sorted(found, key=lambda i: int(i["id"]))[0]["key"] if found else None

          def link_partner(key):
              if not flag("LINK_CONSOLIDATION"): return None
              partner = find_partner()
              if not partner or partner == key: return None
              have = jira("GET", f"/rest/api/3/issue/{key}?fields=issuelinks")["fields"].get("issuelinks", [])
              if any((l.get("outwardIssue") or l.get("inwardIssue") or {}).get("key") == partner for l in have):
                  return partner
              jira("POST", "/rest/api/3/issueLink", {"type": {"name": PARTNER_LINK_TYPE},
                   "inwardIssue": {"key": partner}, "outwardIssue": {"key": key}})
              print(f"Linked {key} to {'change request' if CONSOLIDATION else 'staging consolidation'} {partner}")
              return partner

          def find_open(reconcile=None):
              # Default: one ticket per version, whatever its status. closed-statuses (opt-in) re-enables
              # "finished" tickets, after which a new ticket would be created for the same version.
              finished = (" AND status not in (" + ", ".join('"' + st.replace('"', '') + '"' for st in CLOSED_STATUSES) + ")"
                          if CLOSED_STATUSES else "")
              body = {"jql": f'project = "{PROJECT}" AND labels = "{VERSION_LABEL}"{finished}',
                      "fields": ["summary", "status"], "maxResults": 50}
              if reconcile: body["reconcileIssues"] = [int(i) for i in reconcile]
              return sorted(jira("POST", "/rest/api/3/search/jql", body).get("issues", []), key=lambda i: int(i["id"]))

          def create_issue():
              if CONSOLIDATION:
                  desc = adf([f"Staging consolidation on top of production {VERSION}."],
                             [f"Every repository merged into {PR_BASE} is listed under Web links."])
              else:
                  desc = adf([f"Aggregated change request for release {VERSION}."],
                             ["Every repository with a PR into the production branch for this version is attached under Web links."],
                             ["Opened automatically by ", (f"{REPO} PR #{PR_NUMBER}", PR_URL), "."])
                  if APPROVAL_ROLES: desc["content"].extend(approvals_block())
              fields = {
                  "project": {"key": PROJECT},
                  "issuetype": {"name": env("JIRA_ISSUE_TYPE", "Task")},
                  "summary": SUMMARY.format(version=VERSION),
                  "labels": [VERSION_LABEL, KIND_LABEL],
                  "description": desc,
              }
              fields.update(EXTRA)
              issue = jira("POST", "/rest/api/3/issue", {"fields": fields})
              print(f"Created {issue['key']}")
              return issue

          def merge_into(canon, dup):
              """Move everything from a duplicate onto the canonical (oldest) ticket, then delete the duplicate."""
              ck, dk = canon["key"], dup["key"]
              print(f"Merging duplicate {dk} into {ck}")
              for l in jira("GET", f"/rest/api/3/issue/{dk}/remotelink") or []:
                  if str(l.get("globalId", "")).startswith("confluence-page:"): continue   # dup's own pages
                  jira("POST", f"/rest/api/3/issue/{ck}/remotelink",
                       {k: l[k] for k in ("globalId", "application", "relationship", "object") if k in l})
              # PR records used by the Confluence pages (keep whichever is newer)
              for p in (jira("GET", f"/rest/api/3/issue/{dk}/properties") or {}).get("keys", []):
                  if not p["key"].startswith("crpr."): continue
                  try:
                      val = jira("GET", f"/rest/api/3/issue/{dk}/properties/{p['key']}").get("value")
                      try: mine = jira("GET", f"/rest/api/3/issue/{ck}/properties/{p['key']}").get("value")
                      except JiraError: mine = None
                      if val and (not mine or str(val.get("updated", "")) > str(mine.get("updated", ""))):
                          jira("PUT", f"/rest/api/3/issue/{ck}/properties/{p['key']}", val)
                  except JiraError as err: warn(f"Could not move {p['key']} from {dk}: {err}")
              # Linked work items
              for l in jira("GET", f"/rest/api/3/issue/{dk}?fields=issuelinks")["fields"].get("issuelinks", []):
                  other = (l.get("outwardIssue") or l.get("inwardIssue") or {}).get("key")
                  if not other or other == ck or l["type"].get("name") == "Duplicate": continue
                  body = ({"inwardIssue": {"key": ck}, "outwardIssue": {"key": other}} if "outwardIssue" in l
                          else {"inwardIssue": {"key": other}, "outwardIssue": {"key": ck}})
                  body["type"] = {"name": l["type"]["name"]}
                  try: jira("POST", "/rest/api/3/issueLink", body)
                  except JiraError as err: warn(f"Could not move link {dk} -> {other}: {err}")
              if flag("DELETE_DUPLICATES"):
                  try:
                      jira("DELETE", f"/rest/api/3/issue/{dk}")
                      print(f"Deleted duplicate {dk}")
                      return
                  except JiraError as err:
                      warn(f"Could not delete duplicate {dk} ({err}). Grant the pipeline account 'Delete work items' "
                           "permission to remove duplicates automatically; relabelling it instead.")
              jira("PUT", f"/rest/api/3/issue/{dk}",
                   {"update": {"labels": [{"remove": VERSION_LABEL}, {"add": f"{KIND_LABEL}-duplicate"}]}})
              jira("POST", f"/rest/api/3/issue/{dk}/comment",
                   {"body": adf([f"Duplicate of {ck}: everything was moved there. Safe to close or delete."])})

          def upsert_link(key):
              if CONSOLIDATION:   # repo only, no PR
                  link = {"globalId": f"github-repo:{REPO}", "relationship": "GitHub repository",
                          "object": {"url": f"{SERVER}/{REPO}", "title": REPO,
                                     "summary": f"last merged into {PR_BASE} · {SHORT}",
                                     "status": {"resolved": False}}}
              else:
                  state = ("merged" if PR_MERGED else "closed without merge") if PR_ACTION == "closed" else "open"
                  link = {"globalId": f"github-pr:{REPO}#{PR_NUMBER}", "relationship": "GitHub pull request",
                          "object": {"url": PR_URL, "title": f"{REPO} #{PR_NUMBER}: {PR_TITLE}"[:255],
                                     "summary": f"{state} · into {PR_BASE} · {SHORT} · @{env('PR_AUTHOR', 'unknown')}",
                                     "status": {"resolved": PR_ACTION == "closed"}}}
              link["application"] = {"type": "com.github", "name": "GitHub"}
              link["object"]["icon"] = {"url16x16": "https://github.com/favicon.ico", "title": "GitHub"}
              jira("POST", f"/rest/api/3/issue/{key}/remotelink", link)

          KEY_RE = re.compile(r"\b[A-Z][A-Z0-9]+-\d+\b")
          LINK_PROJECTS = {p.strip().upper() for p in env("CR_LINK_PROJECTS").split(",") if p.strip()}

          def load_commits():
              path, commits = env("PR_COMMITS_FILE"), []
              if path and os.path.exists(path):
                  with open(path) as fh:
                      for line in fh:
                          line = line.strip()
                          if line:
                              try: commits.append(json.loads(line))
                              except json.JSONDecodeError: pass
              return commits

          def referenced_keys(own_key, commits):
              """Jira keys found in commit messages, PR title and PR description (in order, de-duplicated)."""
              found = []
              sources = [c.get("msg", "") for c in commits] + [PR_TITLE, env("PR_BODY")]
              for k in KEY_RE.findall("\n".join(sources)):
                  if k == own_key or k in found: continue
                  if LINK_PROJECTS and k.split("-")[0] not in LINK_PROJECTS: continue
                  found.append(k)
              return found

          def link_issues(key, keys):
              """Add each referenced ticket as a linked work item on the change request (idempotent)."""
              if not keys: return [], []
              link_type = env("CR_LINK_TYPE", "Relates")
              existing = set()
              for l in jira("GET", f"/rest/api/3/issue/{key}?fields=issuelinks")["fields"].get("issuelinks", []):
                  for side in ("inwardIssue", "outwardIssue"):
                      if side in l: existing.add(l[side]["key"])
              linked, skipped = [], []
              for k in keys[:100]:
                  if k in existing: continue
                  try:
                      jira("POST", "/rest/api/3/issueLink", {"type": {"name": link_type},
                           "inwardIssue": {"key": k}, "outwardIssue": {"key": key}})
                      linked.append(k)
                  except JiraError as e:
                      skipped.append(k)   # not a real ticket (e.g. "SHA-256"), or no access
                      warn(f"Could not link {k}: HTTP {e.code}")
              print(f"Linked work items: +{len(linked)} new, {len(skipped)} skipped, {len(existing)} already linked")
              return linked, skipped

          def build_summary(own_key, commits):
              """ADF blocks summarising what a release PR contains (change-request flow only)."""
              if not flag("CR_INCLUDE_SUMMARY"):
                  return []
              blocks = []
              def text(t, bold=False):
                  n = {"type": "text", "text": t}
                  if bold: n["marks"] = [{"type": "strong"}]
                  return n
              def link(t, href): return {"type": "text", "text": t, "marks": [{"type": "link", "attrs": {"href": href}}]}
              def para(*nodes): return {"type": "paragraph", "content": [n for n in nodes if n.get("text")]}
              def bullets(items):
                  return {"type": "bulletList", "content": [
                      {"type": "listItem", "content": [{"type": "paragraph", "content": it}]} for it in items]}

              # Stats from the PR event payload (not available for a plain push)
              if env("PR_COMMITS"):
                  stats = [f"{env('PR_COMMITS', '?')} commits", f"{env('PR_CHANGED_FILES', '?')} files",
                           f"+{env('PR_ADDITIONS', '0')} / -{env('PR_DELETIONS', '0')}"]
                  blocks.append(para(text("Summary: ", True), text(" · ".join(stats))))

              # PR description (trimmed)
              body = env("PR_BODY")
              if body:
                  limit = int(env("CR_SUMMARY_BODY_CHARS", "1500"))
                  if len(body) > limit: body = body[:limit].rstrip() + " …"
                  blocks.append(para(text("Description", True)))
                  for chunk in [c.strip() for c in re.split(r"\n\s*\n", body) if c.strip()]:
                      blocks.append(para(text(re.sub(r"\s*\n\s*", " ", chunk))))

              # Changes: merged feature PRs (from merge commits) and regular commits
              items = []
              for c in commits:
                  msg = c.get("msg", "")
                  lines = [l.strip() for l in msg.splitlines() if l.strip()]
                  if not lines: continue
                  subject = lines[0]
                  m = re.match(r"Merge pull request #(\d+) from \S+", subject)
                  if m:
                      title = lines[1] if len(lines) > 1 else subject
                      items.append([link(f"#{m.group(1)}", f"{SERVER}/{REPO}/pull/{m.group(1)}"), text(f" {title}")])
                  elif re.match(r"Merge (remote-tracking )?branch ", subject):
                      continue  # branch sync noise
                  else:
                      items.append([link(c.get("sha", "")[:7], f"{SERVER}/{REPO}/commit/{c.get('sha', '')}"),
                                    text(f" {subject}"), text(f" (@{c['author']})" if c.get("author") else "")])
              keys_seen = referenced_keys(own_key, commits)

              if items:
                  cap = int(env("CR_SUMMARY_MAX_ITEMS", "30"))
                  blocks.append(para(text("Changes", True)))
                  shown = [[n for n in it if n.get("text")] for it in items[:cap]]
                  if len(items) > cap:
                      more_url = f"{PR_URL}/commits" if env("PR_NUMBER") else f"{SERVER}/{REPO}/commits/{SHA}"
                      shown.append([link(f"…and {len(items) - cap} more", more_url)])
                  blocks.append(bullets(shown))
              if keys_seen:
                  nodes = [text("Linked work items: " if flag("CR_LINK_ISSUES") else "Jira issues referenced: ", True)]
                  for i, k in enumerate(keys_seen[:50]):
                      if i: nodes.append(text(", "))
                      nodes.append(link(k, f"{BASE}/browse/{k}"))
                  blocks.append(para(*nodes))
              return blocks

          def comment(key, commits):
              summary = []
              if CONSOLIDATION:
                  para = [f"{REPO}: merged into {PR_BASE} (", (SHORT, f"{SERVER}/{REPO}/commit/{SHA}"),
                          f") on top of production {VERSION} — ", ("run", RUN_URL)]
                  summary = build_summary(key, commits)
              elif PR_ACTION in ("opened", "reopened", "ready_for_review"):
                  para = [f"{REPO}: PR {PR_ACTION.replace('_', ' ')} into {PR_BASE} for {VERSION} — ",
                          (f"PR #{PR_NUMBER}", PR_URL), " · ", ("run", RUN_URL)]
                  summary = build_summary(key, commits)
              elif PR_ACTION == "closed":
                  para = [f"{REPO}: {'merged' if PR_MERGED else 'closed without merge'} ({SHORT}) for {VERSION} — ",
                          (f"PR #{PR_NUMBER}", PR_URL), " · ", ("run", RUN_URL)]
                  if PR_MERGED: summary = build_summary(key, commits)
              else:
                  return
              doc = adf(para)
              doc["content"].extend(summary)
              jira("POST", f"/rest/api/3/issue/{key}/comment", {"body": doc})

          # --------------------------------------------------------------------------- #
          # Confluence release record (change-request flow)
          #   * Each PR's details are stored on the Jira ticket as an issue property
          #     (one property per PR, so repos never overwrite each other).
          #   * The Confluence page is rebuilt from ALL those properties on every run,
          #     and linked back to the ticket as a web link.
          # --------------------------------------------------------------------------- #
          import hashlib, html, urllib.parse
          from datetime import datetime, timezone

          CONF_SPACE = env("CONFLUENCE_SPACE_KEY")
          CONF_PARENT = env("CONFLUENCE_PARENT_ID")
          CONF_TITLE = env("CONFLUENCE_TITLE_TEMPLATE", "Change request {key}: {summary}")
          CONF_FOLDER_TITLE = env("CONFLUENCE_FOLDER_TITLE_TEMPLATE")   # e.g. "Release {version}"; empty = no folder
          CONF_MANUAL = flag("CONFLUENCE_MANUAL_ITEMS")
          CONF_TESTS = flag("CONFLUENCE_TEST_PLAN")
          CONF_TESTS_TITLE = env("CONFLUENCE_TEST_PLAN_TITLE_TEMPLATE", "Post-deployment plan {key}: {summary}")
          TESTS_SLOT = "<!--smoke-tests-->"
          CONF_NOTES = flag("CONFLUENCE_RELEASE_NOTES")
          CONF_NOTES_TITLE = env("CONFLUENCE_RELEASE_NOTES_TITLE_TEMPLATE", "{product} V{version} – Release Notes")
          CONF_NOTES_PARENT = env("CONFLUENCE_RELEASE_NOTES_PARENT_ID")
          OVERVIEW_SLOT = "<!--overview-->"
          KNOWN_SLOT = "<!--known-issues-->"
          KNOWN_TEMPLATE = "<ul><li><p>None known.</p></li></ul>"
          RELEASE_NOTE_FIELD = env("RELEASE_NOTE_FIELD", "Release note")
          SKIP_LABEL = env("RELEASE_NOTES_SKIP_LABEL", "no-release-notes")
          PRODUCT_NAME = env("RELEASE_NOTES_PRODUCT")
          NOTE_GROUPS = (("New features", {"story", "epic", "feature", "new feature"}),
                         ("Improvements", set()),                       # everything that isn't a feature or a bug
                         ("Bug fixes", {"bug", "defect", "incident"}))
          PR_PROP_PREFIX = "crpr."
          MANUAL_SLOT = "<!--manual-release-items-->"
          _EMPTY_ROW = "".join("<td><p></p></td>" for _ in range(5))
          MANUAL_TEMPLATE = ('<table><tbody>'
                             '<tr><th>#</th><th>Item</th><th>Owner</th><th>When</th><th>Status</th><th>Notes</th></tr>'
                             + "".join(f"<tr><td><p>{i}</p></td>{_EMPTY_ROW}</tr>" for i in (1, 2, 3)) +
                             '</tbody></table>')

          def _clean_manual(sec):
              """Drop what older pipeline versions put in this section, keep anything people wrote."""
              # old intro paragraphs
              sec = re.sub(r"<p\b[^>]*>(?:(?!</p>).)*(?:Release steps the CI/CD pipeline|Maintained by hand on)(?:(?!</p>).)*</p>",
                           "", sec, flags=re.S)
              # old example row
              sec = re.sub(r"<tr\b[^>]*>(?:(?!</tr>).)*Example: enable feature flag new-checkout(?:(?!</tr>).)*</tr>", "", sec, flags=re.S)
              return sec.strip()

          def _inline_child(sec):
              """Older versions embedded a child page; pull its table(s) into this page instead."""
              m = re.search(r'<ac:structured-macro\b[^>]*ac:name="include".*?</ac:structured-macro>', sec, flags=re.S)
              if not m: return sec
              title = re.search(r'ri:content-title="([^"]+)"', m.group(0))
              tables = []
              if title:
                  try:
                      q = urllib.parse.urlencode({"space-id": conf_space_id(), "title": html.unescape(title.group(1))})
                      found = jira("GET", f"/wiki/api/v2/pages?{q}").get("results", [])
                      if found:
                          child = jira("GET", f"/wiki/api/v2/pages/{found[0]['id']}?body-format=storage")
                          body = ((child.get("body") or {}).get("storage") or {}).get("value", "")
                          tables = re.findall(r"<table\b.*?</table>", _clean_manual(body), flags=re.S)
                          print(f"Copied manual items from old child page {found[0]['id']} (you can delete that page)")
                  except JiraError as err:
                      warn(f"Could not read the old manual-items page: {err}")
              return sec.replace(m.group(0), "".join(tables))

          def _has_rows(sec):
              return any(len(re.findall(r"<tr\b", t)) > 1 for t in re.findall(r"<table\b.*?</table>", sec, flags=re.S))

          def manual_section(sec):
              sec = _clean_manual(_inline_child(sec))
              if _has_rows(sec): return sec
              # no filled-in table: keep any text people wrote, only fill a genuinely empty section
              outside = re.sub(r"<[^>]+>|&nbsp;", "", re.sub(r"<table\b.*?</table>", "", sec, flags=re.S)).strip()
              return sec if outside else MANUAL_TEMPLATE

          def _h2(title):
              # matches <h2>Title</h2>, tolerating attributes and inline tags the Confluence editor may add
              return re.compile(r"<h2\b[^>]*>\s*(?:<[^>]+>\s*)*" + re.escape(title) + r"\s*(?:</[^>]+>\s*)*</h2>", re.I)

          def extract_manual(body):
              """Current content of the Manual release items section, or None if it can't be located safely."""
              m = _h2("Manual release items").search(body)
              if m:
                  p = _h2("Pull requests").search(body, m.end())
                  if p: return manual_section(body[m.end():p.start()])
                  return None
              # No manual heading. Fresh placeholder, or a page made before this section existed?
              if "Generating release record" in body: return MANUAL_TEMPLATE
              o, p = _h2("Overview").search(body), _h2("Pull requests").search(body)
              if o and p:
                  t = body.find("</table>", o.end())
                  between = body[t + len("</table>"):p.start()].strip() if 0 <= t < p.start() else "?"
                  if not between: return MANUAL_TEMPLATE     # older generated page: safe to add the section
              return None   # heading renamed/removed by someone: don't guess, don't overwrite
          PAGE_PROP = "cr.confluence"

          def e(s): return html.escape(str(s if s is not None else ""), quote=True)

          def get_prop(key, prop):
              try: return jira("GET", f"/rest/api/3/issue/{key}/properties/{prop}").get("value")
              except JiraError as err:
                  if err.code == 404: return None
                  raise

          def set_prop(key, prop, value):
              jira("PUT", f"/rest/api/3/issue/{key}/properties/{prop}", value)

          def change_items(commits):
              items = []
              for c in commits:
                  lines = [l.strip() for l in c.get("msg", "").splitlines() if l.strip()]
                  if not lines: continue
                  subject = lines[0]
                  m = re.match(r"Merge pull request #(\d+) from \S+", subject)
                  if m:
                      items.append({"ref": f"#{m.group(1)}", "url": f"{SERVER}/{REPO}/pull/{m.group(1)}",
                                    "text": (lines[1] if len(lines) > 1 else subject)[:200], "author": c.get("author")})
                  elif not re.match(r"Merge (remote-tracking )?branch ", subject):
                      sha = c.get("sha", "")
                      items.append({"ref": sha[:7], "url": f"{SERVER}/{REPO}/commit/{sha}",
                                    "text": subject[:200], "author": c.get("author")})
              return items

          def save_pr_record(key, commits):
              prop = PR_PROP_PREFIX + slug(REPO).replace(".", "_") + "." + PR_NUMBER
              old = get_prop(key, prop) or {}
              state = ("merged" if PR_MERGED else "closed") if PR_ACTION == "closed" else "open"
              changes = change_items(commits)
              rec = {
                  "repo": REPO, "number": PR_NUMBER, "title": PR_TITLE[:300], "url": PR_URL, "state": state,
                  "author": env("PR_AUTHOR"), "base": PR_BASE, "sha": SHA,
                  "commits": env("PR_COMMITS") or old.get("commits"), "files": env("PR_CHANGED_FILES") or old.get("files"),
                  "additions": env("PR_ADDITIONS") or old.get("additions"), "deletions": env("PR_DELETIONS") or old.get("deletions"),
                  "description": (env("PR_BODY")[:3000]) or old.get("description", ""),
                  # if commits couldn't be fetched this run, keep the previous list rather than blanking it
                  "changes": changes[:100] if commits else old.get("changes", []),
                  "changes_total": len(changes) if commits else old.get("changes_total", 0),
                  "keys": referenced_keys(key, commits) if commits else old.get("keys", []),
                  "updated": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              }
              set_prop(key, prop, rec)

          def load_pr_records(key):
              keys = [p["key"] for p in (jira("GET", f"/rest/api/3/issue/{key}/properties") or {}).get("keys", [])
                      if p["key"].startswith(PR_PROP_PREFIX)]
              recs = [r for r in (get_prop(key, k) for k in keys) if r]
              return sorted(recs, key=lambda r: (r["repo"], int(r["number"])))

          def render_page(key, issue, recs, tests_url=None, notes_url=None):
              f = issue["fields"]
              url = f"{BASE}/browse/{key}"
              status = f["status"]["name"]
              repos = sorted({r["repo"] for r in recs})
              out = []
              out.append('<ac:structured-macro ac:name="info"><ac:rich-text-body><p>'
                         f'Generated automatically from <a href="{e(url)}" data-card-appearance="inline">{e(url)}</a>. '
                         + ('Everything except the <strong>Manual release items</strong> section is regenerated on each pipeline run.'
                            if CONF_MANUAL else 'Edits to this page are overwritten on the next pipeline run.')
                         + '</p></ac:rich-text-body></ac:structured-macro>')
              out.append("<h2>Overview</h2><table><tbody>")
              for label, val in (("Change request", f'<a href="{e(url)}">{e(key)}</a>'), ("Summary", e(f["summary"])),
                                 ("Version", e(VERSION)), ("Status", f"<strong>{e(status)}</strong>"),
                                 ("Repositories", e(", ".join(r.split("/")[-1] for r in repos)) or "-"),
                                 ("Pull requests", str(len(recs))),
                                 *([("Staging consolidation", f'<a href="{e(BASE)}/browse/{e(STAGING["key"])}">{e(STAGING["key"])}</a>'
                                                              + (f' · <a href="{e(BASE)}/wiki/pages/viewpage.action?pageId={e(STAGING["page"])}">staging page</a>'
                                                                 if STAGING.get("page") else ""))]
                                   if STAGING["key"] else []),
                                 *([("Post-deployment plan", f'<a href="{e(tests_url)}">Open post-deployment plan</a>')] if tests_url else []),
                                 *([("Release notes", f'<a href="{e(notes_url)}">Open release notes</a>')] if notes_url else []),
                                 ("Last updated", e(datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")))):
                  out.append(f"<tr><th>{e(label)}</th><td>{val}</td></tr>")
              out.append("</tbody></table>")

              if CONF_MANUAL:
                  out.append("<h2>Manual release items</h2>" + MANUAL_SLOT)

              out.append("<h2>Pull requests</h2>")
              if recs:
                  out.append("<table><tbody><tr><th>Repository</th><th>Pull request</th><th>State</th><th>Author</th>"
                             "<th>Size</th><th>Commit</th></tr>")
                  for r in recs:
                      size = f'{e(r.get("commits") or "?")} commits, {e(r.get("files") or "?")} files, ' \
                             f'+{e(r.get("additions") or 0)} / -{e(r.get("deletions") or 0)}'
                      out.append(f'<tr><td>{e(r["repo"])}</td><td><a href="{e(r["url"])}">#{e(r["number"])} {e(r["title"])}</a></td>'
                                 f'<td>{e(r["state"])}</td><td>{e(r.get("author"))}</td><td>{size}</td>'
                                 f'<td><a href="{e(SERVER)}/{e(r["repo"])}/commit/{e(r["sha"])}">{e(r["sha"][:7])}</a></td></tr>')
                  out.append("</tbody></table>")
              else:
                  out.append("<p>No pull requests yet.</p>")

              links = f.get("issuelinks", [])
              out.append("<h2>Linked work items</h2>")
              if links:
                  out.append("<table><tbody><tr><th>Key</th><th>Summary</th><th>Status</th><th>Link</th></tr>")
                  for l in links:
                      side = "outwardIssue" if "outwardIssue" in l else "inwardIssue"
                      other = l[side]; of = other.get("fields", {})
                      rel = l["type"].get("outward" if side == "outwardIssue" else "inward", l["type"].get("name", ""))
                      out.append(f'<tr><td><a href="{e(BASE)}/browse/{e(other["key"])}">{e(other["key"])}</a></td>'
                                 f'<td>{e(of.get("summary"))}</td><td>{e((of.get("status") or {}).get("name"))}</td><td>{e(rel)}</td></tr>')
                  out.append("</tbody></table>")
              else:
                  out.append("<p>None.</p>")

              out.append("<h2>Changes by pull request</h2>")
              for r in recs:
                  out.append(f'<h3>{e(r["repo"])} <a href="{e(r["url"])}">#{e(r["number"])}</a>: {e(r["title"])}</h3>')
                  desc = [c.strip() for c in re.split(r"\n\s*\n", r.get("description") or "") if c.strip()]
                  for c in desc:
                      out.append("<p>" + e(re.sub(r"\s*\n\s*", " ", c)) + "</p>")
                  if r.get("changes"):
                      out.append("<ul>")
                      for it in r["changes"]:
                          who = f' (@{e(it["author"])})' if it.get("author") else ""
                          out.append(f'<li><a href="{e(it["url"])}">{e(it["ref"])}</a> {e(it["text"])}{who}</li>')
                      extra = (r.get("changes_total") or 0) - len(r["changes"])
                      if extra > 0: out.append(f'<li><a href="{e(r["url"])}/commits">…and {extra} more</a></li>')
                      out.append("</ul>")
                  if r.get("keys"):
                      out.append("<p><strong>Referenced work items:</strong> " + ", ".join(
                          f'<a href="{e(BASE)}/browse/{e(k)}">{e(k)}</a>' for k in r["keys"]) + "</p>")
              return "".join(out)

          def linked_items_html(issue):
              links = issue["fields"].get("issuelinks", [])
              if not links: return "<p>None.</p>"
              out = ["<table><tbody><tr><th>Key</th><th>Summary</th><th>Status</th><th>Link</th></tr>"]
              for l in links:
                  side = "outwardIssue" if "outwardIssue" in l else "inwardIssue"
                  other = l[side]; of = other.get("fields", {})
                  rel = l["type"].get("outward" if side == "outwardIssue" else "inward", l["type"].get("name", ""))
                  out.append(f'<tr><td><a href="{e(BASE)}/browse/{e(other["key"])}">{e(other["key"])}</a></td>'
                             f'<td>{e(of.get("summary"))}</td><td>{e((of.get("status") or {}).get("name"))}</td><td>{e(rel)}</td></tr>')
              out.append("</tbody></table>")
              return "".join(out)

          def tests_template(recs):
              repos = sorted({r["repo"] for r in recs})
              rows = repos or ["(component)"]
              out = ['<h2>Smoke tests</h2>',
                     '<p>For the test team to run <strong>after deployment</strong>. Add, change or remove rows freely: '
                     '<strong>this section and everything below it are kept as-is by the pipeline.</strong> '
                     'Repos added to the release later are listed under "What to test" above; add rows for them here.</p>',
                     '<table><tbody><tr><th>#</th><th>Repository / area</th><th>Test</th><th>Expected result</th>'
                     '<th>Tester</th><th>Result</th><th>Notes</th></tr>']
              for i, repo in enumerate(rows, 1):
                  out.append(f'<tr><td><p>{i}</p></td><td><p>{e(repo.split("/")[-1])}</p></td><td><p>Smoke test after deploy</p></td>'
                             '<td><p></p></td><td><p></p></td><td><p>Not run</p></td><td><p></p></td></tr>')
              out.append('</tbody></table>')
              out.append('<h2>Sign-off</h2><table><tbody><tr><th>Tested by</th><th>Date</th><th>Outcome</th><th>Notes</th></tr>'
                         '<tr><td><p></p></td><td><p></p></td><td><p>Pass / Fail / Pass with issues</p></td><td><p></p></td></tr>'
                         '</tbody></table>')
              return "".join(out)

          def extract_tests(body, recs):
              """Everything from the Smoke tests heading to the end of the page (owned by the test team)."""
              m = _h2("Smoke tests").search(body)
              if m: return body[m.start():]
              if "Generating post-deployment plan" in body: return tests_template(recs)
              return None

          def render_test_page(key, issue, recs, record_url):
              f = issue["fields"]
              url = f"{BASE}/browse/{key}"
              out = ['<ac:structured-macro ac:name="info"><ac:rich-text-body><p>'
                     f'Post-deployment plan for <a href="{e(url)}" data-card-appearance="inline">{e(url)}</a>. '
                     'The sections above <strong>Smoke tests</strong> are regenerated by the pipeline; '
                     '<strong>Smoke tests</strong> and <strong>Sign-off</strong> belong to the test team and are never changed.'
                     '</p></ac:rich-text-body></ac:structured-macro>']
              out.append("<h2>Release</h2><table><tbody>")
              rows = [("Change request", f'<a href="{e(url)}">{e(key)}</a>'), ("Summary", e(f["summary"])),
                      ("Version", e(VERSION)), ("Status", f'<strong>{e(f["status"]["name"])}</strong>')]
              if record_url: rows.append(("Release record", f'<a href="{e(record_url)}">Open release record</a>'))
              rows += [("Repositories", e(", ".join(sorted({r["repo"].split("/")[-1] for r in recs}))) or "-"),
                       ("Last updated", e(datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")))]
              out += [f"<tr><th>{e(a)}</th><td>{b}</td></tr>" for a, b in rows]
              out.append("</tbody></table>")

              out.append("<h2>What to test</h2>")
              if not recs: out.append("<p>No pull requests yet.</p>")
              for r in recs:
                  out.append(f'<h3>{e(r["repo"].split("/")[-1])}: <a href="{e(r["url"])}">#{e(r["number"])} {e(r["title"])}</a> '
                             f'({e(r["state"])})</h3>')
                  changes = r.get("changes") or []
                  if changes:
                      out.append("<ul>")
                      for it in changes[:15]:
                          out.append(f'<li><a href="{e(it["url"])}">{e(it["ref"])}</a> {e(it["text"])}</li>')
                      extra = (r.get("changes_total") or len(changes)) - min(len(changes), 15)
                      if extra > 0: out.append(f'<li><a href="{e(r["url"])}/commits">…and {extra} more</a></li>')
                      out.append("</ul>")
                  if r.get("keys"):
                      out.append("<p><strong>Work items to verify:</strong> " + ", ".join(
                          f'<a href="{e(BASE)}/browse/{e(k)}">{e(k)}</a>' for k in r["keys"]) + "</p>")
              out.append("<h2>Linked work items</h2>" + linked_items_html(issue))
              out.append(TESTS_SLOT)
              return "".join(out)

          _CACHE = {}

          def adf_text(node):
              """Plain text from Atlassian Document Format (or a plain string)."""
              if node is None: return ""
              if isinstance(node, str): return node
              if isinstance(node, list): return "".join(adf_text(n) for n in node)
              t = node.get("type")
              if t == "text": return node.get("text", "")
              if t == "hardBreak": return "\n"
              inner = adf_text(node.get("content", []))
              return inner + ("\n" if t in ("paragraph", "heading", "listItem", "tableRow") else "")

          def product_name():
              if PRODUCT_NAME: return PRODUCT_NAME
              if "product" not in _CACHE:
                  try: _CACHE["product"] = jira("GET", f"/rest/api/3/project/{PROJECT}").get("name") or PROJECT
                  except JiraError: _CACHE["product"] = PROJECT
              return _CACHE["product"]

          def release_note_field_id():
              if "rnf" not in _CACHE:
                  _CACHE["rnf"] = None
                  if RELEASE_NOTE_FIELD:
                      try:
                          for fld in jira("GET", "/rest/api/3/field") or []:
                              if (fld.get("name") or "").strip().lower() == RELEASE_NOTE_FIELD.lower():
                                  _CACHE["rnf"] = fld["id"]; break
                      except JiraError: pass
              return _CACHE["rnf"]

          def release_date():
              try:
                  for v in jira("GET", f"/rest/api/3/project/{PROJECT}/versions") or []:
                      if v.get("name", "").lstrip("vV").endswith(VERSION) and v.get("releaseDate"):
                          return datetime.strptime(v["releaseDate"], "%Y-%m-%d").strftime("%-d %B %Y")
              except (JiraError, ValueError): pass
              return "TBC"

          def note_items(key, exclude):
              """Linked tickets with the text product managers want: Release note field > 'Release note:' line > none."""
              fid = release_note_field_id()
              fields = ["summary", "status", "issuetype", "description", "labels"] + ([fid] if fid else [])
              res = jira("POST", "/rest/api/3/search/jql", {"jql": f'issue in linkedIssues("{key}")',
                                                            "fields": fields, "maxResults": 100})
              items = []
              for it in res.get("issues", []):
                  f = it.get("fields", {})
                  labels = {l.lower() for l in f.get("labels") or []}
                  if it["key"] in exclude or labels & {"change-request", "consolidation", SKIP_LABEL.lower()}: continue
                  note = adf_text(f.get(fid)).strip() if fid else ""
                  if not note:
                      m = re.search(r"(?im)^\s*release note\s*:\s*(.+)$", adf_text(f.get("description")))
                      note = m.group(1).strip() if m else ""
                  if note.strip() in ("-", "n/a", "none"): continue
                  itype = ((f.get("issuetype") or {}).get("name") or "").lower()
                  group = next((g for g, types in NOTE_GROUPS if itype in types), "Improvements")
                  items.append({"key": it["key"], "title": f.get("summary", ""), "note": note,
                                "status": (f.get("status") or {}).get("name", ""), "group": group})
              return sorted(items, key=lambda x: x["key"])

          def approval_state(key):
              """(pending_roles, rejected_roles) from the Approvals table in the ticket description."""
              desc = jira("GET", f"/rest/api/3/issue/{key}?fields=description")["fields"].get("description") or {}
              content, pending, rejected = desc.get("content", []), [], []
              for i, n in enumerate(content):
                  if not _is_approvals_heading(n): continue
                  table = next((x for x in content[i + 1:] if x.get("type") == "table"), None)
                  for row in (table or {}).get("content", [])[1:]:
                      cells = [adf_text(c).strip() for c in row.get("content", [])]
                      if len(cells) < 3: continue
                      decision = cells[2].lower()
                      if decision.startswith("approved"): continue
                      (rejected if decision.startswith("reject") else pending).append(cells[0])
                  break
              return pending, rejected

          def _join(names): return names[0] if len(names) == 1 else ", ".join(names[:-1]) + " and " + names[-1]

          def notes_defaults(items, recs):
              counts = [(len([i for i in items if i["group"] == g]), w) for g, w in
                        (("New features", "new feature"), ("Improvements", "improvement"), ("Bug fixes", "bug fix"))]
              parts = [f"{n} {w}{'es' if n != 1 and w.endswith('fix') else ('s' if n != 1 else '')}" for n, w in counts if n]
              comps = len({r["repo"] for r in recs})
              what = _join(parts) if parts else "changes"
              draft = (f"V{e(VERSION)} includes {e(what)}" + (f" across {comps} component{'s' if comps != 1 else ''}" if comps else "") + ". "
                       "<em>(Product manager: replace this with a 2–3 sentence summary of what this release means for users.)</em>")
              return [f"<p>{draft}</p>", KNOWN_TEMPLATE]

          def extract_notes(body, defaults):
              """[overview, known issues] as people left them, or defaults for a new/old-style page; None = refuse."""
              ov = _h2("Overview").search(body)
              kn = _h2("Known issues / notes").search(body)
              if ov and kn:
                  nxt = [m.start() for h in ("New features", "Improvements", "Bug fixes", "Components updated")
                         for m in [_h2(h).search(body, ov.end())] if m]
                  if nxt and min(nxt) < kn.start(): return [body[ov.end():min(nxt)], body[kn.end():]]
                  return None
              if "Generating release notes" in body: return defaults
              if _h2("Changes in this release").search(body):            # page from the previous version
                  hl = _h2("Highlights").search(body); ch = _h2("Changes in this release").search(body)
                  old = body[hl.end():ch.start()] if hl and ch and hl.end() < ch.start() else ""
                  if re.sub(r"<[^>]+>|&nbsp;|\s", "", old) and "Product management: write" not in old:
                      return [old, defaults[1]]                           # keep what PM wrote in Highlights
                  return defaults
              return None

          def render_notes(key, issue, recs, record_url, items, pending, rejected):
              f = issue["fields"]
              url = f"{BASE}/browse/{key}"
              status = f["status"]["name"]
              shipped = status.lower() in ("released to production", "closed", "done", "released")
              out = ['<ac:structured-macro ac:name="info"><ac:rich-text-body><p>'
                     '<strong>Overview</strong> and <strong>Known issues / notes</strong> are yours to edit. '
                     'Everything else updates automatically from Jira. To change a bullet, edit the ticket\'s '
                     f'<strong>{e(RELEASE_NOTE_FIELD or "Release note")}</strong> (or a "Release note:" line in its description); '
                     f'label a ticket <code>{e(SKIP_LABEL)}</code> to leave it out.</p></ac:rich-text-body></ac:structured-macro>']
              out.append(f"<p><strong>Release date:</strong> {e(release_date())}<br/>"
                         f"<strong>Status:</strong> {'Released' if shipped else 'In progress'}</p>")
              out.append("<h2>Overview</h2>" + OVERVIEW_SLOT)
              for group, _ in NOTE_GROUPS:
                  rows = [i for i in items if i["group"] == group]
                  if not rows: continue
                  out.append(f"<h2>{e(group)}</h2><ul>")
                  for i in rows:
                      text = f"<strong>{e(i['title'])}</strong>" + (f" – {e(i['note'])}" if i["note"] else "")
                      out.append(f'<li>{text} <a href="{e(BASE)}/browse/{e(i["key"])}">{e(i["key"])}</a> '
                                 f'<em>({e(i["status"])})</em></li>')
                  out.append("</ul>")
              if not items: out.append("<h2>Improvements</h2><p>No changes recorded yet.</p>")
              comps = sorted({r["repo"].split("/")[-1] for r in recs})
              out.append("<h2>Components updated</h2>" + ("<ul>" + "".join(f"<li>{e(c)}</li>" for c in comps) + "</ul>"
                                                         if comps else "<p>None yet.</p>"))
              cm = [f'Change request: <a href="{e(url)}">{e(key)}: {e(f["summary"])}</a> <em>({e(status)})</em>']
              if rejected: cm.append(f"Rejected by the {e(_join(rejected))}.")
              if pending: cm.append(f"Approvals from the {e(_join(pending))} are still pending.")
              elif not rejected and APPROVAL_ROLES: cm.append("All approvals received.")
              if record_url: cm.append(f'Release record: <a href="{e(record_url)}">open</a>')
              out.append("<h2>Change management</h2><ul>" + "".join(f"<li>{c}</li>" for c in cm) + "</ul>")
              out.append("<h2>Known issues / notes</h2>" + KNOWN_SLOT)
              return "".join(out)

          def write_page(page, title, generated, slot, extract, label):
              """Write `generated`, re-inserting the people-owned part read from the live page. False = refused."""
              for attempt in range(4):
                  cur = jira("GET", f"/wiki/api/v2/pages/{page['id']}?body-format=storage")
                  live = ((cur.get("body") or {}).get("storage") or {}).get("value", "")
                  keep = extract(live) if slot else ""
                  if slot and keep is None:
                      warn(f"{label} not updated: a heading that marks the hand-edited section was renamed or removed. "
                           "Restore the heading name (or the previous page version).")
                      return False
                  if isinstance(slot, (list, tuple)):
                      body = generated
                      for sl, kp in zip(slot, keep): body = body.replace(sl, kp)
                  else:
                      body = generated.replace(slot, keep) if slot else generated
                  try:
                      jira("PUT", f"/wiki/api/v2/pages/{page['id']}", {
                          "id": page["id"], "status": "current", "title": title,
                          "body": {"representation": "storage", "value": body},
                          "version": {"number": cur["version"]["number"] + 1,
                                      "message": f"{REPO} {('#' + PR_NUMBER) if PR_NUMBER else SHORT} ({PR_ACTION if PR_NUMBER else 'push'})"}})
                      return True
                  except JiraError as err:
                      if err.code != 409 or attempt == 3: raise   # 409: someone saved in between, retry
                      time.sleep(random.uniform(0.5, 2))

          def conf_space_id():
              spaces = jira("GET", f"/wiki/api/v2/spaces?keys={urllib.parse.quote(CONF_SPACE)}").get("results", [])
              if not spaces: raise JiraError(404, f"Confluence space '{CONF_SPACE}' not found or no access")
              return spaces[0]["id"]

          def ensure_page(space_id, title, body, parent_id=None, known_id=None):
              """Find a page by stored id or title; create it (with `body`) only if it doesn't exist."""
              if known_id:
                  try: return jira("GET", f"/wiki/api/v2/pages/{known_id}")
                  except JiraError as err:
                      if err.code != 404: raise          # 404: page was deleted, find/recreate below
              def by_title():
                  q = urllib.parse.urlencode({"space-id": space_id, "title": title})
                  return jira("GET", f"/wiki/api/v2/pages?{q}").get("results", [])
              found = by_title()
              if not found:
                  payload = {"spaceId": space_id, "status": "current", "title": title,
                             "body": {"representation": "storage", "value": body}}
                  if parent_id: payload["parentId"] = parent_id
                  try:
                      p = jira("POST", "/wiki/api/v2/pages", payload)
                      print(f"Created Confluence page {p['id']}: {title}")
                      return p
                  except JiraError as err:
                      if err.code not in (400, 409): raise   # same title just created by a concurrent run
                      found = by_title()
                      if not found: raise
              return jira("GET", f"/wiki/api/v2/pages/{found[0]['id']}")

          def find_folders(space_key, title):
              """IDs of folders with this exact title in the space (via CQL; empty if the search can't do folders)."""
              cql = f'space = "{space_key}" AND type = folder AND title = "{title.replace(chr(34), "")}"'
              try:
                  res = jira("GET", "/wiki/rest/api/search?" + urllib.parse.urlencode({"cql": cql, "limit": 25}))
                  ids = [str((r.get("content") or {}).get("id")) for r in res.get("results", [])]
                  return sorted({i for i in ids if i and i != "None"}, key=int)
              except JiraError:
                  return []

          def ensure_folder(key, space_id, title, stored):
              """One folder per release. Returns (container_id, kind) or (None, None)."""
              fid = stored.get("folderId")
              if fid:
                  try:
                      jira("GET", f"/wiki/api/v2/{'folders' if stored.get('folderKind') != 'page' else 'pages'}/{fid}")
                      return fid, stored.get("folderKind", "folder")
                  except JiraError as err:
                      if err.code != 404: raise
              found = find_folders(CONF_SPACE, title)
              if found: return found[0], "folder"
              try:
                  payload = {"spaceId": space_id, "title": title}
                  if CONF_PARENT: payload["parentId"] = CONF_PARENT
                  mine = str(jira("POST", "/wiki/api/v2/folders", payload)["id"])
                  print(f"Created folder {mine}: {title}")
              except JiraError as err:
                  found = find_folders(CONF_SPACE, title)          # created by a concurrent run?
                  if found: return found[0], "folder"
                  warn(f"Could not create a Confluence folder ({err}); grouping the pages under a parent page instead.")
                  p = ensure_page(space_id, title, f"<p>Pages for {e(title)}.</p>", CONF_PARENT or None)
                  return p["id"], "page"
              # Two repos may have created a folder at the same moment: keep the oldest, remove ours if it lost.
              time.sleep(random.uniform(1, 3))
              candidates = {mine, *find_folders(CONF_SPACE, title)}
              other = (get_prop(key, PAGE_PROP) or {}).get("folderId")
              if other: candidates.add(str(other))
              winner = min(candidates, key=int)
              if winner != mine:
                  try: jira("DELETE", f"/wiki/api/v2/folders/{mine}"); print(f"Removed duplicate folder {mine}")
                  except JiraError as err: warn(f"Duplicate empty folder {mine} could not be removed: {err}")
              return winner, "folder"

          def place_in(page, container_id):
              """Move a page into the release folder if it isn't there yet."""
              if str(page.get("parentId") or "") == str(container_id): return
              try:
                  jira("PUT", f"/wiki/rest/api/content/{page['id']}/move/append/{container_id}")
                  print(f"Moved page {page['id']} into {container_id}")
              except JiraError as err:
                  warn(f"Could not move page {page['id']} into the release folder: {err}")

          def digest_of(html_text):
              return hashlib.sha256(re.sub(r"Last updated</th><td>[^<]*", "", html_text).encode()).hexdigest()

          def publish_confluence(key):
              if not CONF_SPACE: return None
              issue = jira("GET", f"/rest/api/3/issue/{key}?fields=summary,status,issuelinks")
              if STAGING["key"]:
                  try: STAGING["page"] = (get_prop(STAGING["key"], PAGE_PROP) or {}).get("pageId")
                  except JiraError: pass
              if STAGING["key"]:   # the consolidation ticket is not a feature/fix: don't list it as a work item
                  issue["fields"]["issuelinks"] = [l for l in issue["fields"].get("issuelinks", [])
                                                   if (l.get("outwardIssue") or l.get("inwardIssue") or {}).get("key") != STAGING["key"]]
              fmt = dict(key=key, summary=issue["fields"]["summary"], version=VERSION, product=product_name())
              title = CONF_TITLE.format(**fmt)[:255]
              stored = get_prop(key, PAGE_PROP) or {}
              space_id = stored.get("spaceId") or conf_space_id()
              folder_id = folder_kind = None
              if CONF_FOLDER_TITLE:
                  folder_id, folder_kind = ensure_folder(key, space_id, CONF_FOLDER_TITLE.format(**fmt)[:255], stored)
                  stored.update(folderId=folder_id, folderKind=folder_kind)
              home = None if folder_id else (CONF_PARENT or None)   # pages go straight into the folder (via move)
              page = ensure_page(space_id, title, "<p>Generating release record…</p>", home, stored.get("pageId"))
              if folder_id: place_in(page, folder_id)
              page_url = f"{BASE}/wiki{page['_links']['webui']}"
              tests = tests_url = None
              tests_title = CONF_TESTS_TITLE.format(**fmt)[:255]
              if CONF_TESTS:
                  tests = ensure_page(space_id, tests_title, "<p>Generating post-deployment plan…</p>",
                                      None if folder_id else page["id"], stored.get("testsId"))
                  if folder_id: place_in(tests, folder_id)
                  tests_url = f"{BASE}/wiki{tests['_links']['webui']}"
              notes = notes_url = None
              notes_title = CONF_NOTES_TITLE.format(**fmt)[:255]
              if CONF_NOTES:
                  notes_home = CONF_NOTES_PARENT or (None if folder_id else page["id"])
                  notes = ensure_page(space_id, notes_title, "<p>Generating release notes…</p>", notes_home, stored.get("notesId"))
                  if folder_id and not CONF_NOTES_PARENT: place_in(notes, folder_id)
                  notes_url = f"{BASE}/wiki{notes['_links']['webui']}"

              for _ in range(3):   # rebuild until no other repo added a PR record meanwhile
                  recs = load_pr_records(key)
                  gen = render_page(key, issue, recs, tests_url, notes_url)
                  h = digest_of(gen)
                  if stored.get("hash") != h:
                      if write_page(page, title, gen, MANUAL_SLOT if CONF_MANUAL else None, extract_manual, "Release record"):
                          stored["hash"] = h
                  if tests:
                      tgen = render_test_page(key, issue, recs, page_url)
                      th = digest_of(tgen)
                      if stored.get("testsHash") != th:
                          if write_page(tests, tests_title, tgen, TESTS_SLOT, lambda b: extract_tests(b, recs), "Post-deployment plan"):
                              stored["testsHash"] = th
                  if notes:
                      items = note_items(key, {STAGING["key"]} if STAGING["key"] else set())
                      pending, rejected = approval_state(key)
                      ngen = render_notes(key, issue, recs, page_url, items, pending, rejected)
                      nh = digest_of(ngen + notes_title)
                      if stored.get("notesHash") != nh:
                          defaults = notes_defaults(items, recs)
                          if write_page(notes, notes_title, ngen, (OVERVIEW_SLOT, KNOWN_SLOT),
                                        lambda b: extract_notes(b, defaults), "Release notes"):
                              stored["notesHash"] = nh
                  stored.update(pageId=page["id"], spaceId=space_id, testsId=tests and tests["id"], notesId=notes and notes["id"],
                                folderId=folder_id, folderKind=folder_kind)
                  set_prop(key, PAGE_PROP, stored)
                  now = [(r["repo"], r["number"], r["updated"]) for r in load_pr_records(key)]
                  if now == [(r["repo"], r["number"], r["updated"]) for r in recs]: break

              for pid, url_, label, t in ((page["id"], page_url, "Release record", title),
                                          (tests and tests["id"], tests_url, "Post-deployment plan", tests_title),
                                          (notes and notes["id"], notes_url, "Release notes", notes_title)):
                  if pid:
                      jira("POST", f"/rest/api/3/issue/{key}/remotelink", {
                          "globalId": f"confluence-page:{pid}", "relationship": label.lower(),
                          "object": {"url": url_, "title": (t if t.lower().startswith(label.lower()) else f"{label}: {t}")[:255]}})
              print(f"Confluence page: {page_url}")
              if tests_url: print(f"Post-deployment plan: {tests_url}")
              if notes_url: print(f"Release notes: {notes_url}")
              return page_url

          # --------------------------------------------------------------------------- #
          # Staging consolidation page (consolidation flow)
          #   * One record per REPO on the consolidation ticket, holding its recent merges.
          #   * Page "Staging consolidation x.y.z" in the same release folder; its
          #     "Staging tests" table belongs to QA and is never changed by the pipeline.
          # --------------------------------------------------------------------------- #
          STG_PAGE = flag("CONFLUENCE_STAGING_PAGE")
          STG_TITLE = env("CONFLUENCE_STAGING_TITLE_TEMPLATE", "Staging consolidation {version}")
          STG_PROP_PREFIX = "crstg."
          STG_SLOT = "<!--staging-tests-->"
          STG_TEMPLATE = ('<table><tbody>'
                          '<tr><th>#</th><th>Repository / area</th><th>Test</th><th>Tester</th><th>Result</th><th>Notes</th></tr>'
                          + "".join(f"<tr><td><p>{i}</p></td>{_EMPTY_ROW}</tr>" for i in (1, 2, 3)) +
                          '</tbody></table>')

          def save_staging_record(key, commits):
              prop = STG_PROP_PREFIX + slug(REPO).replace(".", "_")
              rec = get_prop(key, prop) or {"repo": REPO, "merges": []}
              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              merge = {"number": PR_NUMBER or None, "title": PR_TITLE[:200] if PR_NUMBER else "",
                       "url": PR_URL if PR_NUMBER else "", "sha": SHA, "at": now,
                       "changes": [dict(it, text=it["text"][:120]) for it in change_items(commits)[:15]],
                       "changes_total": len(change_items(commits)), "keys": referenced_keys(key, commits)[:30]}
              merges = [m for m in rec.get("merges", []) if m.get("sha") != SHA] + [merge]
              rec.update(repo=REPO, merges=merges[-8:], updated=now)
              while len(json.dumps(rec)) > 30000 and len(rec["merges"]) > 1:   # Jira property size limit
                  rec["merges"] = rec["merges"][1:]
              set_prop(key, prop, rec)

          def load_staging_records(key):
              keys = [p["key"] for p in (jira("GET", f"/rest/api/3/issue/{key}/properties") or {}).get("keys", [])
                      if p["key"].startswith(STG_PROP_PREFIX)]
              return sorted([r for r in (get_prop(key, k) for k in keys) if r], key=lambda r: r["repo"])

          def extract_staging(body):
              m = _h2("Staging tests").search(body)
              if m:
                  p = _h2("Merged to staging").search(body, m.end())
                  if not p: return None
                  sec = body[m.end():p.start()]
                  return sec if re.sub(r"<[^>]+>|&nbsp;|\s", "", sec) or "<table" in sec else STG_TEMPLATE
              if "Generating staging page" in body: return STG_TEMPLATE
              return None

          def render_staging(key, issue, recs, cr_key):
              f = issue["fields"]
              url = f"{BASE}/browse/{key}"
              merges = sum(len(r.get("merges", [])) for r in recs)
              out = ['<ac:structured-macro ac:name="info"><ac:rich-text-body><p>'
                     f'Generated automatically from <a href="{e(url)}" data-card-appearance="inline">{e(url)}</a>. '
                     'Everything except the <strong>Staging tests</strong> table is regenerated on each merge to staging.'
                     '</p></ac:rich-text-body></ac:structured-macro>']
              rows = [("Consolidation ticket", f'<a href="{e(url)}">{e(key)}</a>'), ("Summary", e(f["summary"])),
                      ("On top of production", e(VERSION)), ("Status", f'<strong>{e(f["status"]["name"])}</strong>')]
              if cr_key: rows.append(("Production change request", f'<a href="{e(BASE)}/browse/{e(cr_key)}">{e(cr_key)}</a>'))
              rows += [("Repositories merged", e(", ".join(r["repo"].split("/")[-1] for r in recs)) or "-"),
                       ("Merges recorded", str(merges)),
                       ("Last updated", e(datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")))]
              out.append("<h2>Overview</h2><table><tbody>" + "".join(f"<tr><th>{e(a)}</th><td>{b}</td></tr>" for a, b in rows)
                         + "</tbody></table>")
              out.append("<h2>Staging tests</h2>" + STG_SLOT)
              out.append("<h2>Merged to staging</h2>")
              if recs:
                  out.append("<table><tbody><tr><th>Repository</th><th>Merges</th><th>Last merged</th><th>Commit</th><th>Last PR</th></tr>")
                  for r in recs:
                      last = r["merges"][-1]
                      pr = f'<a href="{e(last["url"])}">#{e(last["number"])} {e(last["title"])}</a>' if last.get("number") else "-"
                      out.append(f'<tr><td>{e(r["repo"].split("/")[-1])}</td><td>{len(r["merges"])}</td><td>{e(last["at"])}</td>'
                                 f'<td><a href="{e(SERVER)}/{e(r["repo"])}/commit/{e(last["sha"])}">{e(last["sha"][:7])}</a></td><td>{pr}</td></tr>')
                  out.append("</tbody></table>")
              else:
                  out.append("<p>Nothing merged yet.</p>")
              out.append("<h2>Changes by repository</h2>")
              for r in recs:
                  out.append(f'<h3>{e(r["repo"].split("/")[-1])}</h3>')
                  for m in reversed(r["merges"]):
                      ref = (f'<a href="{e(m["url"])}">#{e(m["number"])}</a> {e(m["title"])}' if m.get("number")
                             else f'<a href="{e(SERVER)}/{e(r["repo"])}/commit/{e(m["sha"])}">{e(m["sha"][:7])}</a>')
                      out.append(f"<p><strong>{e(m['at'])}</strong> · {ref}</p>")
                      if m.get("changes"):
                          out.append("<ul>" + "".join(f'<li><a href="{e(it["url"])}">{e(it["ref"])}</a> {e(it["text"])}</li>'
                                                      for it in m["changes"]))
                          extra = (m.get("changes_total") or 0) - len(m["changes"])
                          if extra > 0: out.append(f"<li>…and {extra} more</li>")
                          out.append("</ul>")
                      if m.get("keys"):
                          out.append("<p>Work items: " + ", ".join(f'<a href="{e(BASE)}/browse/{e(k)}">{e(k)}</a>' for k in m["keys"]) + "</p>")
              out.append("<h2>Linked work items</h2>" + linked_items_html(issue))
              return "".join(out)

          def publish_staging(key):
              if not CONF_SPACE or not STG_PAGE: return None
              issue = jira("GET", f"/rest/api/3/issue/{key}?fields=summary,status,issuelinks")
              if CR_PARTNER["key"]:   # the production change request is not a work item
                  issue["fields"]["issuelinks"] = [l for l in issue["fields"].get("issuelinks", [])
                                                   if (l.get("outwardIssue") or l.get("inwardIssue") or {}).get("key") != CR_PARTNER["key"]]
              fmt = dict(key=key, summary=issue["fields"]["summary"], version=VERSION, product=product_name())
              title = STG_TITLE.format(**fmt)[:255]
              stored = get_prop(key, PAGE_PROP) or {}
              space_id = stored.get("spaceId") or conf_space_id()
              folder_id = folder_kind = None
              if CONF_FOLDER_TITLE:
                  folder_id, folder_kind = ensure_folder(key, space_id, CONF_FOLDER_TITLE.format(**fmt)[:255], stored)
              page = ensure_page(space_id, title, "<p>Generating staging page…</p>",
                                 None if folder_id else (CONF_PARENT or None), stored.get("pageId"))
              if folder_id: place_in(page, folder_id)
              for _ in range(3):
                  recs = load_staging_records(key)
                  gen = render_staging(key, issue, recs, CR_PARTNER["key"])
                  h = digest_of(gen)
                  if stored.get("hash") != h and write_page(page, title, gen, STG_SLOT, extract_staging, "Staging page"):
                      stored["hash"] = h
                  stored.update(pageId=page["id"], spaceId=space_id, folderId=folder_id, folderKind=folder_kind)
                  set_prop(key, PAGE_PROP, stored)
                  if [(r["repo"], r["updated"]) for r in load_staging_records(key)] == [(r["repo"], r["updated"]) for r in recs]: break
              page_url = f"{BASE}/wiki{page['_links']['webui']}"
              jira("POST", f"/rest/api/3/issue/{key}/remotelink", {
                  "globalId": f"confluence-page:{page['id']}", "relationship": "staging page",
                  "object": {"url": page_url, "title": title if title.lower().startswith("staging") else f"Staging page: {title}"}})
              print(f"Staging page: {page_url}")
              return page_url

          def main():
              fixed = env("JIRA_ISSUE_KEY")
              if fixed:
                  issues, created_id = [jira("GET", f"/rest/api/3/issue/{fixed}?fields=summary")], None
                  jira("PUT", f"/rest/api/3/issue/{fixed}", {"update": {"labels": [{"add": VERSION_LABEL}]}})
              else:
                  issues, created_id = find_open(), None
                  if not issues:
                      time.sleep(random.uniform(0, 6))
                      issues = find_open()
                  if not issues:
                      mine = create_issue(); created_id = mine["id"]
                      for _ in range(2):
                          time.sleep(3); issues = find_open([mine["id"]])
                      if not any(i["id"] == mine["id"] for i in issues): issues.append(mine)
                      issues.sort(key=lambda i: int(i["id"]))

              canon = issues[0]
              for dup in issues[1:]: merge_into(canon, dup)
              key = canon["key"]

              if not CONSOLIDATION:
                  try: ensure_approvals(key)
                  except JiraError as err: warn(f"Could not add the approvals table to {key}: {err}")
              upsert_link(key)
              try:
                  partner = link_partner(key)
                  (CR_PARTNER if CONSOLIDATION else STAGING)["key"] = partner
              except JiraError as err: warn(f"Could not link the consolidation/change request tickets: {err}")
              jira("PUT", f"/rest/api/3/issue/{key}", {"update": {"labels": [{"add": REPO_LABEL}]}})
              commits = load_commits()
              comment(key, commits)
              linked = []
              if flag("CR_LINK_ISSUES"):
                  linked, _ = link_issues(key, referenced_keys(key, commits))
              page_url = None
              if not CONSOLIDATION and CONF_SPACE:
                  try:   # the release record must never block the change request
                      save_pr_record(key, commits)
                      page_url = publish_confluence(key)
                  except JiraError as err:
                      warn(f"Confluence release record not updated: {err}")
              if CONSOLIDATION and CONF_SPACE and STG_PAGE:
                  try:   # the staging page must never fail the run
                      save_staging_record(key, commits)
                      page_url = publish_staging(key)
                  except JiraError as err:
                      warn(f"Confluence staging page not updated: {err}")

              status = jira("GET", f"/rest/api/3/issue/{key}?fields=status")["fields"]["status"]["name"]
              url = f"{BASE}/browse/{key}"
              created = str(created_id == canon["id"]).lower()
              with open(os.environ.get("GITHUB_OUTPUT", os.devnull), "a") as f:
                  f.write(f"issue-key={key}\nissue-url={url}\ncreated={created}\nstatus={status}\n")
                  if page_url: f.write(f"confluence-url={page_url}\n")
              with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as f:
                  f.write(f"### {FLOW}: [{key}]({url})\n- Version: `{VERSION}`\n- Status: **{status}**\n")
                  if linked: f.write(f"- Linked work items added: {', '.join(linked)}\n")
                  if page_url: f.write(f"- Release record: [Confluence page]({page_url})\n")
              print(f"[{FLOW}] {REPO} -> {key} ({status})")

              if not CONSOLIDATION and flag("REQUIRE_APPROVAL") and PR_ACTION != "closed" and status.lower() not in APPROVED:
                  fail(f"{key} is '{status}'; needs one of {', '.join(sorted(APPROVED))}. Re-run after approval.")

          try: main()
          except JiraError as e: fail(str(e))
          PY

      - name: Comment Jira link on PR
        if: >-
          always() && inputs.flow == 'change-request' && inputs.comment-on-pr &&
          steps.cr.outputs.issue-key != '' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.cr.outputs.issue-key }}
          URL: ${{ steps.cr.outputs.issue-url }}
          STATUS: ${{ steps.cr.outputs.status }}
          VERSION: ${{ steps.version.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
          PAGE: ${{ steps.cr.outputs.confluence-url }}
        run: |
          body="Change request **[$KEY]($URL)** (status: $STATUS) tracks release \`$VERSION\` across all repos."
          if [ -n "$PAGE" ]; then body="$body Release record: [Confluence page]($PAGE)."; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
